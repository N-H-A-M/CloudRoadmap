telegram:
  name: telegram-bot
  namespace: telegram
  replicas: 1

  image:
    repository: nielh1/telegram-bot
    tag: latest

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  probes:
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

  secrets:
    botSecret: telegram-secret
    postgresSecret: postgres-secret

postgres:
  host: postgres.database.svc.cluster.local
  dbName: telegramdb
  name: postgres
  namespace: database

  image:
    repository: postgres
    tag: "16"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3

    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  
  ports:
    iport: "5432"
    targetPort: "5432"

  secrets:
    secretname: postgres-secret

  presistence:
    capacity: "5Gi"
    hostPath:  /data/postgres
    volumeMounts:
      mountPath: /var/lib/postgresql/data

    volumes:
      claimName: postgres-pvc

