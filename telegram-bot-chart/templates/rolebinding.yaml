  apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: {{  .Values.telegram.name  }}-rolebinding
    namespace: {{  .Values.telegram.namespace  }}

  subjects:
    - kind: ServiceAccount
      name: {{  .Values.telegram.name  }}-sa
      namespace: {{  .Values.telegram.namespace  }}

  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{  .Values.telegram.name  }}-role
