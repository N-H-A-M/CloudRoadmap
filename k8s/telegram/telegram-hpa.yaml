apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telegram-hpa
  namespace: telegram
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telegram-bot          # must match your existing Deployment name
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70