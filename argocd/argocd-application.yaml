apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telegram-bot-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/N-H-A-M/CloudRoadmap.git
    targetRevision: helm-chart
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: telegram
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true